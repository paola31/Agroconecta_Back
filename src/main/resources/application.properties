spring.application.name=agroconecta-back
server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Agroconecta?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:agro_backend}
spring.datasource.password=${DB_PASSWORD:agro_backend123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=warn

app.security.jwt-secret=${JWT_SECRET:agroconecta-demo-jwt-secret-change-before-production-2026-secure-key}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
